services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: genkin
      POSTGRES_PASSWORD: genkin_dev_password
      POSTGRES_DB: genkin_impact
    ports:
      - "5434:5432"
    volumes:
      - genkin_pg_data:/var/lib/postgresql/data

volumes:
  genkin_pg_data:
