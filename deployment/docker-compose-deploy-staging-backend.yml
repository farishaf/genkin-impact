services:
  backend:
    build: ../${BACKEND_DIR}
    container_name: ${PROJECT_NAME}-backend-staging
    restart: unless-stopped

    env_file:
      - ../${BACKEND_DIR}/.env

    ports:
      - "${BACKEND_PORT:-4001}:4000"
    volumes:
      # transaction attachments (multer writes to /app/uploads)
      - uploads:/app/uploads
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: ${PROJECT_NAME}-staging-net

volumes:
  uploads:
