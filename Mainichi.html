document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"{{ onAddNotes }}\" rows=\"2\" style=\"field-sizing:content;min-height:60px;border:1px solid oklch(90.5% 0.008 255);border-radius:8px;padding:8px 10px;background:oklch(100% 0 0);font-size:14px;line-height:1.5;color:oklch(20% 0.012 255)\"><\u002Ftextarea><\u002Flabel>\n    <\u002Fdiv>\n    <div style=\"display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid oklch(90.5% 0.008 255)\">\n      <button sc-camel-on-click=\"{{ closeAdd }}\" style=\"padding:9px 15px;font-size:13px;border-radius:12px;background:oklch(98.4% 0.004 255);border:1px solid oklch(90.5% 0.008 255)\">Cancel<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onAddSave }}\" style=\"padding:9px 15px;font-size:13px;border-radius:12px;background:oklch(19% 0.008 255);color:oklch(100% 0 0)\">Add<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position:fixed;left:50%;transform:translateX(-50%);top:{{ toastTop }};z-index:90;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:oklch(19% 0.008 255);color:oklch(100% 0 0);font-size:13px;box-shadow:0 10px 30px oklch(20% 0.03 258 / 0.25);white-space:nowrap\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"oklch(76% 0.16 162)\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>{{ toastMsg }}<\u002Fdiv>\n<\u002Fsc-if>\n\n<input type=\"file\" accept=\"image/*\" ref=\"{{ fileRef }}\" sc-camel-on-change=\"{{ onFile }}\" style=\"display:none\">\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;weekStart&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Monday&quot;,&quot;Sunday&quot;],&quot;default&quot;:&quot;Monday&quot;,&quot;tsType&quot;:&quot;'Monday' | 'Sunday'&quot;,&quot;section&quot;:&quot;Calendar&quot;},&quot;showRunTotals&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Calendar&quot;},&quot;restSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:30,&quot;max&quot;:300,&quot;step&quot;:15,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:90,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Workout&quot;}}\">\nconst P2 = n => String(n).padStart(2, '0');\nconst KEY = d => d.getFullYear() + '-' + P2(d.getMonth() + 1) + '-' + P2(d.getDate());\nconst FROM = k => { const a = String(k).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };\nconst ADD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);\nconst TODAY = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };\nconst DIFF = (a, b) => Math.round((a - b) / 864e5);\nconst DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];\nconst DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];\nconst MON = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];\nconst SHORT = d => DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()].slice(0, 3);\nconst RP = n => 'Rp ' + Math.round(n || 0).toLocaleString('en-US');\nconst UID = p => p + '-' + Math.random().toString(36).slice(2, 9);\nconst C = {\n  ink: 'oklch(20% 0.012 255)', ink2: 'oklch(45% 0.02 258)', muted: 'oklch(56% 0.015 258)', faint: 'oklch(72% 0.012 258)',\n  line: 'oklch(90.5% 0.008 255)', box: 'oklch(78% 0.012 258)', green: 'oklch(72.3% 0.163 162)', greenDeep: 'oklch(48% 0.11 163)',\n  white: 'oklch(100% 0 0)', solid: 'oklch(19% 0.008 255)', badge: 'oklch(94.4% 0.021 259)',\n  glow: '0 1px 4px oklch(0% 0 0 / 0.08), inset 0 1px 1px oklch(100% 0 0)'\n};\nconst TY = {\n  workout: { label: 'Workout', fg: 'oklch(48% 0.16 258)', bg: 'oklch(95.2% 0.03 258)', dot: 'oklch(58% 0.17 258)' },\n  run: { label: 'Run', fg: 'oklch(45% 0.11 162)', bg: 'oklch(95.4% 0.04 165)', dot: 'oklch(66% 0.15 162)' },\n  event: { label: 'Event', fg: 'oklch(50% 0.14 45)', bg: 'oklch(95.6% 0.035 65)', dot: 'oklch(68% 0.15 55)' }\n};\nconst CATS = ['Groceries', 'Household', 'Snacks', 'Personal care', 'Other'];\nconst CAT_ICON = { Groceries: '🛒', Household: '🧽', Snacks: '🍫', 'Personal care': '🧴', Other: '🧾' };\nconst ICONS = ['📄', '🗾', '💻', '🏋️', '🏃', '📚', '🎯', '🧠', '🎸', '🌱', '✍️'];\nconst ACCOUNTS = ['BCA Debit', 'GoPay', 'Cash'];\nconst RUN_PRESETS = [['Easy run', '5', '7:00'], ['Long run', '14', '6:45'], ['Tempo run', '7', '5:45'], ['Intervals', '6', '5:00']];\nconst STORE_KEY = 'mainichi:v1';\nconst ICON = {\n  today: 'M4 11l8-7 8 7v8.5a.5.5 0 0 1-.5.5H15v-6H9v6H4.5a.5.5 0 0 1-.5-.5Z',\n  calendar: 'M5 5h14a1.5 1.5 0 0 1 1.5 1.5v12A1.5 1.5 0 0 1 19 20H5a1.5 1.5 0 0 1-1.5-1.5v-12A1.5 1.5 0 0 1 5 5ZM3.5 10h17M8 3v4M16 3v4',\n  money: 'M4 6h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1ZM3 10h18M16 14.5h2'\n};\n\nfunction mkEx(name, n, reps, kg, note) {\n  return { id: UID('x'), name, note: note || '', sets: Array.from({ length: n }, () => ({ id: UID('s'), reps: String(reps), kg: kg ? String(kg) : '', done: false })) };\n}\nfunction copyEx(list, done) { return list.map(e => ({ ...e, id: UID('x'), sets: e.sets.map(s => ({ ...s, id: UID('s'), done: !!done })) })); }\nfunction setStats(ex) { let t = 0, d = 0; (ex || []).forEach(x => x.sets.forEach(s => { t++; if (s.done) d++; })); return [d, t]; }\nfunction lineItem(name, qty, price, cat) { return { id: UID('i'), name, qty, price, cat }; }\nfunction sampleReceipt() {\n  const L = lineItem;\n  return { store: 'Hero Supermarket', items: [L('Salmon fillet 250 g', 1, 89000, 'Groceries'), L('Broccoli', 1, 15900, 'Groceries'), L('Tofu', 2, 8500, 'Groceries'), L('Soy sauce 600 ml', 1, 23400, 'Groceries'), L('Cherry tomatoes', 1, 19900, 'Groceries'), L('Kitchen towel', 1, 27500, 'Household'), L('Dark chocolate', 1, 32000, 'Snacks')] };\n}\n\nfunction seedData() {\n  const today = TODAY(), tk = KEY(today), k = n => KEY(ADD(today, n));\n  const routines = [\n    { id: 'r-ua', title: 'Upper A', focus: 'Push', exercises: [mkEx('Bench press', 4, 6, 60, 'Pause 1s on the chest'), mkEx('Overhead press', 3, 8, 35, 'Squeeze glutes, no lean back'), mkEx('Incline DB press', 3, 10, 20), mkEx('Lateral raise', 3, 15, 8), mkEx('Triceps pushdown', 3, 12, 25)] },\n    { id: 'r-ub', title: 'Upper B', focus: 'Pull', exercises: [mkEx('Pull-up', 4, 6, 0, 'Full hang at the bottom'), mkEx('Barbell row', 4, 8, 50, 'Pull to the belly button'), mkEx('Face pull', 3, 15, 15), mkEx('Hammer curl', 3, 10, 12), mkEx('Rear delt fly', 3, 15, 6)] },\n    { id: 'r-la', title: 'Lower A', focus: 'Legs', exercises: [mkEx('Back squat', 4, 5, 80, 'Brace, ribs down'), mkEx('Romanian deadlift', 3, 8, 70), mkEx('Bulgarian split squat', 3, 10, 14, 'Per leg'), mkEx('Calf raise', 4, 12, 40), mkEx('Plank', 3, '45s', 0)] }\n  ];\n  const events = [];\n  const race = KEY(ADD(today, ((7 - today.getDay()) % 7) + 14));\n  let jl = new Date(today.getFullYear(), 11, 1); while (jl.getDay() !== 0) jl = ADD(jl, 1);\n  const jlpt = KEY(jl);\n  const skip = new Set([-9, -20]);\n  for (let i = -42; i <= 49; i++) {\n    const d = ADD(today, i), dk = KEY(d), w = d.getDay(), wk = Math.floor((i + 42) / 7);\n    const done = i < 0 && !skip.has(i);\n    const push = e => events.push({ id: UID('e'), date: dk, done, notes: '', ...e });\n    if (w === 1 || w === 3 || w === 5) { const r = routines[w === 1 ? 0 : w === 3 ? 2 : 1]; push({ type: 'workout', title: r.title, focus: r.focus, routineId: r.id, exercises: copyEx(r.exercises, done) }); }\n    if (dk === race) push({ type: 'run', title: '10K race', km: '10', pace: '5:40', detail: 'Tune-up race. Bib pickup the day before.' });\n    else if (w === 2) push({ type: 'run', title: 'Intervals', km: '6', pace: '5:00', detail: '6 × 400 m, 90 s jog between' });\n    else if (w === 4) push({ type: 'run', title: 'Tempo run', km: '7', pace: '5:45', detail: '2 km easy · 4 km tempo · 1 km easy' });\n    else if (w === 6) push({ type: 'run', title: 'Long run', km: String(Math.min(10 + Math.floor(wk * 0.7), 18) - (wk % 4 === 3 ? 3 : 0)), pace: '6:45', detail: 'Conversational pace. Gel at 45 min.' });\n    else if (w === 0) push({ type: 'run', title: 'Easy run', km: '5', pace: '7:00', detail: 'Recovery, zone 2' });\n    if (i === -5) push({ type: 'event', title: 'Dentist', time: '10:00' });\n    if (i === 2) push({ type: 'event', title: 'Dinner with Sarah', time: '19:00' });\n    if (i === 8) push({ type: 'event', title: \"Mom's birthday\", time: '', notes: 'Order the cake a day before.' });\n    if (dk === jlpt) push({ type: 'event', title: 'JLPT N3 exam', time: '08:30', notes: 'Admission voucher, 2 pencils, eraser, watch.' });\n  }\n  const tw = events.find(e => e.date === tk && e.type === 'workout');\n  if (tw) { tw.exercises[0].sets.forEach(s => { s.done = true; }); tw.exercises[1].sets[0].done = true; tw.exercises[1].sets[1].done = true; }\n\n  const T = (text, done, pageId) => ({ id: UID('t'), text, done: !!done, pageId: pageId || null });\n  const days = {\n    [k(-3)]: { todos: [T('Japanese study', 1, 'p-jp'), T('Ngoding — category mapping', 1, 'p-code'), T('Call bank about card limit', 1)], notes: '' },\n    [k(-2)]: { todos: [T('Japanese study', 1, 'p-jp'), T('Weekly groceries', 1), T('Clean the shoe rack', 0)], notes: 'Rest day. Walked 6k steps.' },\n    [k(-1)]: { todos: [T('Japanese study', 1, 'p-jp'), T('Ngoding — fix sync bug', 1, 'p-code'), T('Pick up laundry', 1), T('Reply to Rina about the trip', 0)], notes: 'Tempo felt smooth, 5:42 average. Calf a bit tight after.' },\n    [tk]: { todos: [T('Japanese study', 0, 'p-jp'), T('Ngoding — receipt import endpoint', 0, 'p-code'), T('Transfer rent', 1), T('Buy groceries for the week', 0), T('Book physio for left calf', 0)], notes: \"Slept 7h. Keep tomorrow's long run easy — walk breaks if the calf complains.\" },\n    [k(1)]: { todos: [T('Japanese study', 0, 'p-jp'), T('Meal prep for the week', 0)], notes: '' }\n  };\n  const CL = (text, done) => ({ id: UID('c'), text, done: !!done });\n  const pages = [\n    { id: 'p-jp', icon: '🗾', title: 'Japanese study', desc: 'Daily routine toward JLPT N3 in December. Anki every morning, one grammar point a day.', checklist: [CL('Anki reviews — 20 min', 1), CL('Genki II L18 grammar: 〜てしまう'), CL('Shadow one NHK Easy article'), CL(\"Write 3 sentences with today's grammar\")], notes: '〜てしまう — do completely, or with regret.\\n宿題を忘れてしまった。 I (regrettably) forgot my homework.\\n\\nKanji to review: 経 験 練 習 届\\n\\nListening practice set 2 → 21 / 28. Weak on 〜ようにする vs 〜ようになる.' },\n    { id: 'p-code', icon: '💻', title: 'Ngoding', desc: 'Working notes for the day job and side exploration.', checklist: [CL('Genkin-Impact: receipt import endpoint'), CL('Mainichi: offline cache with IndexedDB'), CL('Review PR #212 — budget rollover', 1)], notes: 'Receipt import\\nPOST /api/receipts → parsed lines. User confirms before anything is written as transactions.\\nReuse category mapping from Genkin (Groceries, Household, Snacks).\\n\\nIdea: ⌘V on the home screen pastes a bill straight into the scanner.' },\n    { id: 'p-work', icon: '🏋️', title: 'Workout routine', block: 'routines', desc: 'Saved movements and routines. Scheduled sessions live in the calendar and open as a checklist.', checklist: [], notes: 'Warm-up: 5 min bike, band pull-aparts × 20, two empty-bar sets.\\nProgression: add 2.5 kg once every set hits the top of the rep range.\\nDeload every 6th week — same movements, 60% load.' },\n    { id: 'p-run', icon: '🏃', title: 'Run training', block: 'runs', desc: 'Half-marathon build toward sub-2:00. The week-by-week plan now lives in the calendar.', checklist: [], notes: 'Heart-rate zones\\nEasy < 145 · Tempo 160–168 · Intervals > 172\\n\\nLong run +1 km per week, cut back every 4th week.\\nShoes: daily trainer for easy days, lighter pair for tempo and race.' }\n  ];\n  const L = lineItem;\n  const purchases = [\n    { id: UID('p'), date: k(-1), time: '19:42', store: 'Superindo', account: 'BCA Debit', items: [L('Eggs, 10 pcs', 1, 28500, 'Groceries'), L('Chicken breast 1 kg', 1, 62000, 'Groceries'), L('Greek yogurt', 2, 21900, 'Groceries'), L('Bananas', 1, 18400, 'Groceries'), L('Oat milk 1 L', 2, 32500, 'Groceries'), L('Dish soap', 1, 14900, 'Household')] },\n    { id: UID('p'), date: k(-4), time: '08:10', store: 'Indomaret', account: 'GoPay', items: [L('Mineral water 1.5 L', 2, 6500, 'Groceries'), L('Protein bar', 3, 15500, 'Snacks'), L('Electrolyte drink', 2, 9800, 'Snacks')] },\n    { id: UID('p'), date: k(-8), time: '17:25', store: 'Ranch Market', account: 'BCA Debit', items: [L('Salmon fillet 250 g', 1, 89000, 'Groceries'), L('Rolled oats 1 kg', 1, 54900, 'Groceries'), L('Blueberries 125 g', 1, 45000, 'Groceries'), L('Peanut butter', 1, 62500, 'Groceries'), L('Kitchen towel', 1, 27500, 'Household')] },\n    { id: UID('p'), date: k(-11), time: '20:05', store: 'Superindo', account: 'Cash', items: [L('Rice 5 kg', 1, 74900, 'Groceries'), L('Tofu', 2, 8500, 'Groceries'), L('Spinach', 2, 7900, 'Groceries'), L('Shampoo', 1, 38900, 'Personal care')] }\n  ];\n  const G = (title, note) => ({ id: UID('g'), title, note });\n  const goals = [\n    G('Pass JLPT N3', 'December exam. Genki II finished, Tobira by spring.'),\n    G('Half marathon under 2:00', 'Build to 18 km long runs. 10K tune-up race in November.'),\n    G('Squat 100 kg × 5', 'At 80 kg now. +2.5 kg whenever all sets hit 5.'),\n    G('Ship Genkin-Impact v1', 'Receipt import, budgets, and a solid mobile view.'),\n    G('Six-month emergency fund', 'Rp 60M set aside, auto-transfer on payday.')\n  ];\n  return { goals, days, pages, events, routines, purchases };\n}\n\nconst DATA_KEYS = ['goals', 'days', 'pages', 'events', 'routines', 'purchases'];\n\nclass Component extends DCLogic {\n  state = this.init();\n  fileRef = React.createRef();\n\n  init() {\n    let data = null;\n    try { data = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { data = null; }\n    if (!data || !DATA_KEYS.every(k => data[k])) data = seedData();\n    const t = TODAY(), tk = KEY(t);\n    return {\n      ...data, w: typeof window !== 'undefined' ? window.innerWidth : 1280,\n      view: 'home', mtab: 'today', stack: [], sel: tk, calY: t.getFullYear(), calM: t.getMonth(), calSel: tk, calFilter: 'all',\n      pageId: null, wref: null, editGoals: false, editWorkout: false, newTodo: '', newCheck: '', newEx: '',\n      openP: null, scan: null, drag: false, add: null, timer: null, toast: null\n    };\n  }\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ w: window.innerWidth });\n    this._last = {}; DATA_KEYS.forEach(k => { this._last[k] = this.state[k]; });\n    window.addEventListener('resize', this._onResize);\n    this._onResize();\n    if (typeof ResizeObserver !== 'undefined') { this._ro = new ResizeObserver(() => { if (window.innerWidth !== this.state.w) this._onResize(); }); this._ro.observe(document.documentElement); }\n    this._onPaste = e => {\n      const items = Array.from((e.clipboardData && e.clipboardData.items) || []);\n      const it = items.find(i => i.type && i.type.indexOf('image/') === 0);\n      if (it) { const f = it.getAsFile(); if (f) this.openScan(f); }\n    };\n    window.addEventListener('paste', this._onPaste);\n    this._tick = setInterval(() => {\n      const t = this.state.timer;\n      if (t) { if (Date.now() >= t.end) this.setState({ timer: null }); else this.forceUpdate(); }\n    }, 500);\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n    if (this._ro) this._ro.disconnect();\n    window.removeEventListener('paste', this._onPaste);\n    clearInterval(this._tick); clearTimeout(this._sv); clearTimeout(this._rt); clearTimeout(this._tt);\n  }\n  componentDidUpdate() {\n    const last = this._last || {};\n    if (DATA_KEYS.some(
