server {
  listen 3000;
  root /usr/share/nginx/html;

  # attachments are capped at 5 MB by the backend
  client_max_body_size 6m;

  # Health data lives behind this app: no framing, no sniffing, no indexing, HTTPS only.
  # ponytail: CSP carries only frame-ancestors; a full script/style policy needs an audit of the font and emoji-picker sources first.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "same-origin" always;

  location /api/ {
    proxy_pass ${BACKEND_ORIGIN}/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
