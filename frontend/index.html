<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Genkin-Impact — Finance, simplified.</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Mirrors readTheme()/readConvention() in src/hooks/useDisplayPrefs.ts.
      try {
        var t = localStorage.getItem("gi.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var c = localStorage.getItem("gi.convention");
        document.documentElement.dataset.convention = c === "western" ? "western" : "eastern";
      } catch (e) {
        document.documentElement.dataset.convention = "eastern";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
