<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Genkin — a calm, private money tracker for people who already watch their spending." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&display=swap"
    />
    <title>Genkin — Your money, finally legible.</title>
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      // Mirrors readTheme()/readConvention() in src/hooks/useDisplayPrefs.ts.
      try {
        var t = localStorage.getItem("gi.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        var c = localStorage.getItem("gi.convention");
        document.documentElement.dataset.convention = c === "western" ? "western" : "eastern";
      } catch (e) {
        document.documentElement.dataset.convention = "eastern";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
